syntax = "proto3";

package bridge.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/MohammadBnei/ukubi-bridge/proto/gen/go/bridge/v1;bridgev1";

// CloudEvent is internal/event.Event on the wire, field for field
// (infra-bootstrap ADR-0060 §3).
message CloudEvent {
  // Bridge-assigned log position. Ack, Nack and Replay take it. Ignored on Publish.
  int64 seq = 1;
  // CloudEvents id, unique per source only. Publish dedups on (source, id);
  // subscribers dedup on (source, id) or seq, never on id alone.
  string id = 2;
  // Set by the bridge on Publish: "client/<name>".
  string source = 3;
  string type = 4;
  // Thread key, e.g. "github/MohammadBnei/editable-blog/pr/42".
  string subject = 5;
  google.protobuf.Timestamp time = 6;
  // JSON.
  bytes data = 7;
  // human | bot | agent | machine.
  string actor = 8;
  string actor_login = 9;
  reserved 10;
  reserved "trusted";
  string owner = 11;
  int32 hops = 12;
  string causation_id = 13;
  // Only Replay sets it.
  bool replayed = 14;
  // The actor is a trusted login, the owner (T0). Only a privileged client
  // sets it on Publish (agent-fleet ADR-0082 §12).
  bool actor_trusted = 15;
  // The subject's author is a trusted login or a fleet agent: the thread is
  // ours. A fork PR is never owned, but the head repo is only in
  // pull_request and pull_request_review payloads: a comment on a fork PR
  // can read owned. GitHub events only; Publish always clears it.
  bool thread_owned = 16;
  // Set by the bridge on delivery, never on Publish. "uncontracted": the
  // event's type is not in the bridge's event contract (only flagged once a
  // contract has loaded). Consumers must ack and skip an event carrying any flag.
  repeated string flags = 17;
  // Set by the bridge on delivery, never on Publish: the raw JSON producer
  // stored with the event, {"kind":"client"|"route","name":...} (a service
  // account client adds "ns", "sa" and "pod"). Empty for an event stored
  // before the column existed.
  bytes producer = 18;
}

// BridgeService is the bus API. Callers authenticate with an authentik access
// token for the ukubi-bridge-api provider; its subject names their entry in
// BRIDGE_API_CLIENTS (infra-bootstrap ADR-0066). A stream ends Unauthenticated
// when its token expires: reconnect with a fresh one; a token with less than
// 5 s left cannot open a stream.
service BridgeService {
  rpc Publish(PublishRequest) returns (PublishResponse);
  // Subscribe streams matching events after the subscription's cursor, one at
  // a time: the next is sent only after the current one is acked or dead-lettered.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  rpc Ack(AckRequest) returns (AckResponse);
  rpc Nack(NackRequest) returns (NackResponse);
  // Replay re-streams logged events from from_seq up to the current head with
  // replayed=true. It needs no ack and moves no cursor.
  rpc Replay(ReplayRequest) returns (stream ReplayResponse);
  // ConfirmGap clears the subscription's gap once the subscriber resynced. Only
  // a version a stream has sent is accepted.
  rpc ConfirmGap(ConfirmGapRequest) returns (ConfirmGapResponse);
  // Tag attaches System tags to logged events. The bridge stores tags and
  // never computes one: atlas resolves them as a client (conception §5, §16
  // decision 6). Only a client allowed to tag may call it; at most 1000 tags
  // per call, system and registry_version at most 256 bytes each.
  rpc Tag(TagRequest) returns (TagResponse);
}

message PublishRequest {
  CloudEvent event = 1;
}

message PublishResponse {
  // True when (source, id) was already in the log; nothing was appended.
  bool duplicate = 1;
}

message SubscribeRequest {
  // The client's own name, or "<client>/<suffix>".
  string name = 1;
  // Type prefixes. Empty matches every type.
  repeated string types = 2;
  // Subject globs: '*' matches any run of characters ('/' included), '?' one.
  // Empty matches every subject.
  repeated string subjects = 3;
  // Systems, as tagged by Tag. Empty: no system filter. Otherwise only events
  // with a tag naming one of them at resolution applied (or one opted into
  // with resolutions), among the tags of the event's current registry version
  // (the one whose first tag arrived last; an older version's tags no longer
  // count). Delivery stays in log order and waits for the tag: when the next
  // event is not tagged yet, the stream holds it (head of line) for the
  // bridge's grace window (BRIDGE_TAG_GRACE, default 60s), then moves past it
  // and every untagged event after it whose window has passed too, records
  // them as a gap and ends Aborted (key stream.gapped): reconnect, and the gap
  // comes first, as for retention. An event tagged after the stream moved past
  // it is not delivered (Replay sees it).
  repeated string systems = 4;
  // Resolutions accepted besides applied, which alone may route a wake by
  // default: any of tracked, placement, manager. ambiguous and unresolved
  // never match. Only with systems.
  repeated string resolutions = 5;
}

message SubscribeResponse {
  // Unset on the message that carries a gap.
  CloudEvent event = 1;
  // Sent first when retention deleted matching events this subscription
  // never acked, or a System filter moved past untagged events: resync from
  // your own source of truth, then ConfirmGap with its version. Sent again on
  // every reconnect until confirmed.
  Gap gap = 2;
  // The event's current tag set (the rows of its current registry version),
  // on every subscription, filtered or not; empty when it is untagged. Check
  // the resolution before acting on it.
  repeated EventTag tags = 3;
}

// Gap is a range of log positions deleted before they were acked
// (infra-bootstrap ADR-0066 §6). Events in it may be lost.
message Gap {
  int64 from_seq = 1;
  int64 to_seq = 2;
  // On Subscribe: what ConfirmGap confirms, starting at 1. A deletion run that
  // widens the gap bumps it, and confirming an older version is
  // FailedPrecondition: reconnect for the current one. 0 on Replay, whose gap
  // needs no confirmation.
  int64 version = 3;
}

message AckRequest {
  string subscription = 1;
  int64 seq = 2;
  reserved 3; // gap_version, never released: ConfirmGap replaced it
}

message AckResponse {}

message ConfirmGapRequest {
  string subscription = 1;
  int64 version = 2;
}

message ConfirmGapResponse {}

message NackRequest {
  string subscription = 1;
  int64 seq = 2;
  string reason = 3;
}

message NackResponse {}

message ReplayRequest {
  string subscription = 1;
  int64 from_seq = 2;
}

message ReplayResponse {
  // Unset on the message that carries a gap.
  CloudEvent event = 1;
  // Sent first when from_seq is at or below the retention watermark: events
  // in it may have been deleted; what follows is what is kept (parked events
  // included).
  Gap gap = 2;
  // The event's current tag set, as on SubscribeResponse. Replay never sends
  // an untagged event to a System-filtered subscription.
  repeated EventTag tags = 3;
}

message TagRequest {
  repeated EventTag tags = 1;
}

// EventTag is one System an event resolved to (conception §5). A tag for the
// same seq, system and registry_version replaces the earlier one.
message EventTag {
  // The event's log position.
  int64 seq = 1;
  // An ArgoCD Application, or an atlas component where none exists. Empty
  // exactly when resolution is unresolved.
  string system = 2;
  // The cascade rung that placed it: applied, tracked, placement, manager;
  // or ambiguous, or unresolved. There is no namespace rung.
  string resolution = 3;
  // The registry version the resolver used (the infra-bootstrap sha and the
  // ArgoCD resource-list snapshot id): a new version may tag the event again,
  // and then only the version whose first tag arrived last counts for a
  // System filter; re-sending an older version's tags does not make it
  // current again.
  string registry_version = 4;
}

message TagResponse {}

// ErrorKey rides as a detail on every error a BridgeService handler returns
// (mountain plan/15 §4): a stable key from the bridge's closed registry
// (internal/bus/errkeys.go, listed in README.md), which a client branches on
// beside the code, and the source whose words the message holds ("" for the
// bridge's own, "store" for pgx's or Postgres's). Messages are for people and
// may change; keys do not. The same bytes also ride as a second detail,
// ukubi.errors.v1.ErrorKey (ukubi-go, the shared name); find either by its
// type, not its position. This message is kept for existing clients and
// slated for removal (README.md).
message ErrorKey {
  string key = 1;
  string source = 2;
}
