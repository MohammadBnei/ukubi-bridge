syntax = "proto3";

package bridge.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/MohammadBnei/ukubi-bridge/proto/gen/go/bridge/v1;bridgev1";

// CloudEvent is internal/event.Event on the wire, field for field
// (infra-bootstrap ADR-0060 §3).
message CloudEvent {
  // Bridge-assigned log position. Ack, Nack and Replay take it. Ignored on Publish.
  int64 seq = 1;
  // CloudEvents id, unique per source only. Publish dedups on (source, id);
  // subscribers dedup on (source, id) or seq, never on id alone.
  string id = 2;
  // Set by the bridge on Publish: "client/<name>".
  string source = 3;
  string type = 4;
  // Thread key, e.g. "github/MohammadBnei/editable-blog/pr/42".
  string subject = 5;
  google.protobuf.Timestamp time = 6;
  // JSON.
  bytes data = 7;
  // human | bot | agent | machine.
  string actor = 8;
  string actor_login = 9;
  bool trusted = 10;
  string owner = 11;
  int32 hops = 12;
  string causation_id = 13;
  // Only Replay sets it.
  bool replayed = 14;
}

// BridgeService is the bus API. Callers authenticate with an authentik access
// token for the ukubi-bridge-api provider; its subject names their entry in
// BRIDGE_API_CLIENTS (infra-bootstrap ADR-0066). A stream ends Unauthenticated
// when its token expires: reconnect with a fresh one; a token with less than
// 5 s left cannot open a stream.
service BridgeService {
  rpc Publish(PublishRequest) returns (PublishResponse);
  // Subscribe streams matching events after the subscription's cursor, one at
  // a time: the next is sent only after the current one is acked or dead-lettered.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
  rpc Ack(AckRequest) returns (AckResponse);
  rpc Nack(NackRequest) returns (NackResponse);
  // Replay re-streams logged events from from_seq up to the current head with
  // replayed=true. It needs no ack and moves no cursor.
  rpc Replay(ReplayRequest) returns (stream ReplayResponse);
  // ConfirmGap clears the subscription's gap once the subscriber resynced. Only
  // a version a stream has sent is accepted.
  rpc ConfirmGap(ConfirmGapRequest) returns (ConfirmGapResponse);
}

message PublishRequest {
  CloudEvent event = 1;
}

message PublishResponse {
  // True when (source, id) was already in the log; nothing was appended.
  bool duplicate = 1;
}

message SubscribeRequest {
  // The client's own name, or "<client>/<suffix>".
  string name = 1;
  // Type prefixes. Empty matches every type.
  repeated string types = 2;
  // Subject globs: '*' matches any run of characters ('/' included), '?' one.
  // Empty matches every subject.
  repeated string subjects = 3;
}

message SubscribeResponse {
  // Unset on the message that carries a gap.
  CloudEvent event = 1;
  // Sent first when retention deleted matching events this subscription
  // never acked: resync from your own source of truth, then ConfirmGap with
  // its version. Sent again on every reconnect until confirmed.
  Gap gap = 2;
}

// Gap is a range of log positions deleted before they were acked
// (infra-bootstrap ADR-0066 §6). Events in it may be lost.
message Gap {
  int64 from_seq = 1;
  int64 to_seq = 2;
  // On Subscribe: what ConfirmGap confirms, starting at 1. A deletion run that
  // widens the gap bumps it, and confirming an older version is
  // FailedPrecondition: reconnect for the current one. 0 on Replay, whose gap
  // needs no confirmation.
  int64 version = 3;
}

message AckRequest {
  string subscription = 1;
  int64 seq = 2;
  reserved 3; // gap_version, never released: ConfirmGap replaced it
}

message AckResponse {}

message ConfirmGapRequest {
  string subscription = 1;
  int64 version = 2;
}

message ConfirmGapResponse {}

message NackRequest {
  string subscription = 1;
  int64 seq = 2;
  string reason = 3;
}

message NackResponse {}

message ReplayRequest {
  string subscription = 1;
  int64 from_seq = 2;
}

message ReplayResponse {
  // Unset on the message that carries a gap.
  CloudEvent event = 1;
  // Sent first when from_seq is at or below the retention watermark: events
  // in it may have been deleted; what follows is what is kept (parked events
  // included).
  Gap gap = 2;
}

// ErrorKey rides as a detail on every error a BridgeService handler returns
// (mountain plan/15 §4): a stable key from the bridge's closed registry
// (internal/bus/errkeys.go, listed in README.md), which a client branches on
// beside the code, and the source whose words the message holds ("" for the
// bridge's own, "store" for pgx's or Postgres's). Messages are for people and
// may change; keys do not. The same bytes also ride as a second detail,
// ukubi.errors.v1.ErrorKey (ukubi-go, the shared name), right after this one;
// this message is kept for existing clients and slated for removal (README.md).
message ErrorKey {
  string key = 1;
  string source = 2;
}
