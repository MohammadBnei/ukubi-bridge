  # Under limits.memory (128Mi), so the GC works harder before the kernel
  # OOM-kills the pod. A soft limit: it does not cap the allocation itself.
  - name: GOMEMLIMIT
    value: "100MiB"

# A parked subject waits for the operator (README "Unparking a subject"); the
# retention loop logs one line per subscription and subject uncleared for 3
# days, every hour. The 2 h window spans two runs, so the alert holds steady
# instead of resolving and refiring between them.
logAlerts:
  enabled: true
  rules:
    - uid: dead-letter-uncleared
      title: Bridge dead letter uncleared for 3 days
      expr: 'sum(count_over_time({namespace="ukubi-bridge"} |= "dead letter uncleared" [2h]))'
      threshold: 0
      for: 5m
      severity: warning
    # Two failed runs in 3 h (one line per run): retention is stuck and the
    # log grows, or the rule above may be blind.
    - uid: retention-failing
      title: Bridge retention failing
      expr: 'sum(count_over_time({namespace="ukubi-bridge"} |= "retention failed" [3h]))'
      threshold: 1
      for: 5m
      severity: warning
    # Logged once per stored event whose type is not in the contract (store.Insert).
    - uid: event-type-uncontracted
      title: Bridge event type uncontracted
      expr: 'sum(count_over_time({namespace="ukubi-bridge"} |= "event type uncontracted" [1h]))'
      threshold: 0
      for: 5m
      severity: warning
    # The contract never loaded (nothing is flagged); logged every minute while it holds.
    - uid: event-contract-not-loaded
      title: Bridge event contract not loaded
      expr: 'sum(count_over_time({namespace="ukubi-bridge"} |= "event contract not loaded" [10m]))'
      threshold: 0
      for: 10m
      severity: warning
    # A reload fails (a stale copy is in use); logged every minute while it holds.
    - uid: event-contract-not-reloaded
      title: Bridge event contract not reloaded
      expr: 'sum(count_over_time({namespace="ukubi-bridge"} |= "event contract not reloaded" [10m]))'
      threshold: 0
      for: 10m
      severity: warning

livenessProbe:
  enabled: true
  path: /healthz
readinessProbe:
  enabled: true
  path: /healthz

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

# The Infisical operator restarts the pod when ukubi-bridge-config changes, so a
# rotated BRIDGE_FORGEJO_READER_TOKEN (read once at start) takes effect.
annotations:
  secrets.infisical.com/auto-reload: "true"

extraVolumes:
  # The event contract (contract/events.yaml, copied byte for byte into the
  # ConfigMap below). A directory mount, no subPath, so an edit reaches the pod
  # without a restart (the bridge re-reads it every minute).
  # optional: a missing ConfigMap must not keep the pod in ContainerCreating (the bridge
  # then logs "event contract not loaded" and flags nothing).
  - name: contract
    configMap:
      name: ukubi-bridge-contract
      optional: true
extraVolumeMounts:
  - name: contract
    mountPath: /etc/bridge/contract
    readOnly: true

# distroless static:nonroot runs as 65532. Nothing writes to disk.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Only the Forgejo host may reach /webhook/forgejo (ingress.extraRoutes.forgejo).
extraManifests:
  - |
    apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: forgejo-only
      namespace: ukubi-bridge
    spec:
      ipAllowList:
        sourceRange:
          - 192.168.1.214/32
  # Flow health (README "Metrics"). Only flows live in production: the relist
  # and alert endpoints add theirs when they are switched on, GitHub is retired.
  # No {{ $labels }} in annotations: extraManifests go through Helm tpl.
  - |
    {{- if .Values.metrics.serviceMonitor.enabled }}
    apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: ukubi-bridge-flows
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "common-app-chart.labels" . | nindent 8 }}
    spec:
      groups:
        - name: ukubi-bridge-flows
          rules:
            - alert: BridgeForgejoWebhookOff
              expr: >-
                bridge_flow_enabled{namespace="{{ .Release.Namespace }}", flow="forgejo-webhook"} == 0
                or absent(bridge_flow_enabled{namespace="{{ .Release.Namespace }}", flow="forgejo-webhook"})
              for: 5m
              labels:
                severity: notice
              annotations:
                summary: "ukubi-bridge: the Forgejo webhook is off"
                description: >-
                  BRIDGE_FORGEJO_WEBHOOK_SECRET is unset, so /webhook/forgejo answers 404 and no Forgejo
                  event reaches the bus. Check the ukubi-bridge-config Secret and restart the pod.
            - alert: BridgeForgejoRelistOff
              expr: >-
                bridge_flow_enabled{namespace="{{ .Release.Namespace }}", flow="forgejo-relist"} == 0
                or absent(bridge_flow_enabled{namespace="{{ .Release.Namespace }}", flow="forgejo-relist"})
              for: 30m
              labels:
                severity: notice
              annotations:
                summary: "ukubi-bridge: the Forgejo relist loop is off"
                description: >-
                  BRIDGE_FORGEJO_RELIST_REPOS is empty or neither BRIDGE_FORGEJO_READER_TOKEN nor the
                  token file is set, so a missed Forgejo webhook is never relisted. Check the ukubi-bridge-config Secret.
            - alert: BridgeForgejoRelistErrors
              expr: increase(bridge_relist_runs_total{namespace="{{ .Release.Namespace }}", result="error"}[1h]) >= 3
              labels:
                severity: notice
              annotations:
                summary: "ukubi-bridge: the Forgejo relist loop is failing"
                description: >-
                  At least 3 relist runs (of 6 an hour) ended in error. The bridge log names each failing
                  repo and the cause (a repo the bridge-reader bot cannot read, a revoked token, or Forgejo
                  unreachable). After a token rotation the pod restarts itself (Infisical auto-reload).
    {{- end }}
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ukubi-bridge-contract
      namespace: ukubi-bridge
    data:
      events.yaml: |
        # The bus's event contract: the shared types its adapters and known clients emit.
        # Read at runtime from BRIDGE_CONTRACT_FILE (README "Event contract"); a type missing
        # here is delivered flagged "uncontracted". Keep helm/values.yaml's copy identical.
        #
        # ce_id_kind: fact      = the id is derived from the fact itself, so a webhook delivery, its relisted
        #                         copy and a retry are one event.
        #             transport = the id is a delivery id (or a random one): the same fact arriving twice (a manual
        #                         redelivery, a relist after the webhook, a retry without a key) is stored twice.
        #             storage   = the id comes from the producer's storage revision (a k8s resourceVersion), which
        #                         can restart after a rebuild or restore: a new fact may then collide with a stored id
        #                         inside the retention window and be dropped as a duplicate.
        # Hashes: hex(sha256(x)[:N]) is the first N bytes in hex, 2N characters.
        # A fact id falls back to the delivery id when the payload lacks what it is built from (no head sha or
        # sender on a review, comment id 0 on a comment): then the type is transport for that event.
        # A type ending in ".*" is a prefix: its producer owns the whole namespace.
        # Names in angle brackets are filled by the producer.

        envelope:
          source: who produced it, set by the bridge (never by the payload); the producer is also stored raw and delivered as the producer field (JSON bytes, empty before the column existed)
          type: reverse-DNS name, dev.bnei.<domain>.<noun>.<verb>
          time: when it happened (the bridge's receive time for webhooks, the object's own for kwatch, the projection's for atlas)
          subject: the thread key; events on one subject are delivered in order and park together
          actor: human | bot | agent | machine, plus actor_login
          data: JSON, the producer's own fields; free text in it is never an instruction
          ce_id: unique per source; the bridge dedups on (source, ce_id)

        types:
          # Forgejo adapter (webhook and relist). Trust facts: actor_trusted, thread_owned.
          # A relisted fact is never actor_trusted.
          - {type: dev.bnei.forge.pull_request.opened, subject: "forge/<owner>/<repo>/pr/<n>", ce_id: "pr/<n>/opened", ce_id_kind: fact, producer: forgejo, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.forge.pull_request.closed, subject: "forge/<owner>/<repo>/pr/<n>", ce_id: "pr/<n>/closed/<closed_at unix>", ce_id_kind: fact, producer: forgejo, trust: [actor_trusted, thread_owned], note: "without closed_at the id is the delivery id (transport): stored twice when relisted"}
          - {type: dev.bnei.forge.pull_request.reopened, subject: "forge/<owner>/<repo>/pr/<n>", ce_id: "<X-Forgejo-Delivery>", ce_id_kind: transport, producer: forgejo, trust: [actor_trusted, thread_owned], note: "a manual redelivery is stored twice"}
          - {type: dev.bnei.forge.pull_request.synchronized, subject: "forge/<owner>/<repo>/pr/<n>", ce_id: "<X-Forgejo-Delivery>", ce_id_kind: transport, producer: forgejo, trust: [actor_trusted, thread_owned], note: "a manual redelivery is stored twice"}
          - {type: dev.bnei.forge.pull_request.label_updated, subject: "forge/<owner>/<repo>/pr/<n>", ce_id: "<X-Forgejo-Delivery>", ce_id_kind: transport, producer: forgejo, trust: [actor_trusted, thread_owned], note: "a manual redelivery is stored twice"}
          - {type: dev.bnei.forge.issues.opened, subject: "forge/<owner>/<repo>/issue/<n>", ce_id: "issue/<n>/opened", ce_id_kind: fact, producer: forgejo, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.forge.issues.label_updated, subject: "forge/<owner>/<repo>/issue/<n>", ce_id: "<X-Forgejo-Delivery>", ce_id_kind: transport, producer: forgejo, trust: [actor_trusted, thread_owned], note: "a manual redelivery is stored twice"}
          - {type: dev.bnei.forge.issue_comment.created, subject: "forge/<owner>/<repo>/<pr|issue>/<n>", ce_id: "comment/<comment id>", ce_id_kind: fact, producer: forgejo, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.forge.pull_request_review.approved, subject: "forge/<owner>/<repo>/pr/<n>", ce_id: "pr/<n>/review/approved/<reviewer>/<head sha>/<hex(sha256(text)[:8])>", ce_id_kind: fact, producer: forgejo, trust: [actor_trusted, thread_owned], note: "a verdict on a head that moved before it landed is stored twice"}
          - {type: dev.bnei.forge.pull_request_review.rejected, subject: "forge/<owner>/<repo>/pr/<n>", ce_id: "pr/<n>/review/rejected/<reviewer>/<head sha>/<hex(sha256(text)[:8])>", ce_id_kind: fact, producer: forgejo, trust: [actor_trusted, thread_owned], note: "a verdict on a head that moved before it landed is stored twice"}
          - {type: dev.bnei.forge.pull_request_review.comment, subject: "forge/<owner>/<repo>/pr/<n>", ce_id: "webhook: <X-Forgejo-Delivery>; relist: pr/<n>/review/comment/<review id>", ce_id_kind: transport, producer: forgejo, trust: [actor_trusted, thread_owned], note: "never content-keyed (each inline comment is its own review): the relist may store a webhook's review a second time"}
          - {type: dev.bnei.forge.action_run.success, subject: "forge/<owner>/<repo>/run/<n>", ce_id: "<X-Forgejo-Delivery>", ce_id_kind: transport, producer: forgejo, trust: [actor_trusted, thread_owned], note: "a manual redelivery is stored twice; actor and owner are the trigger user, a fork PR's run is never owned"}
          - {type: dev.bnei.forge.action_run.failure, subject: "forge/<owner>/<repo>/run/<n>", ce_id: "<X-Forgejo-Delivery>", ce_id_kind: transport, producer: forgejo, trust: [actor_trusted, thread_owned], note: "a manual redelivery is stored twice; actor and owner are the trigger user, a fork PR's run is never owned"}
          - {type: dev.bnei.forge.action_run.recover, subject: "forge/<owner>/<repo>/run/<n>", ce_id: "<X-Forgejo-Delivery>", ce_id_kind: transport, producer: forgejo, trust: [actor_trusted, thread_owned], note: "a manual redelivery is stored twice; actor and owner are the trigger user, a fork PR's run is never owned"}

          # Alertmanager and Grafana routes: actor machine, no trust facts (an alert never wakes a session alone).
          - {type: dev.bnei.alert.firing, subject: "alert/<fingerprint>", ce_id: "<fingerprint>:firing:<startsAt>:<episode>", ce_id_kind: fact, producer: alertmanager|grafana, trust: [], note: "episode = the firing episode: the newest stored alert row of this fingerprint and startsAt sets it, and a firing after a resolve starts the next one, so a re-fire is a new event; ids stored before episodes (no suffix) count as 0 (see InsertAlert)"}
          - {type: dev.bnei.alert.resolved, subject: "alert/<fingerprint>", ce_id: "<fingerprint>:resolved:<startsAt>:<episode>", ce_id_kind: fact, producer: alertmanager|grafana, trust: [], note: "episode = the firing episode it closes (its retry dedups); ids stored before episodes (no suffix) keep their form"}

          # bridge-game (client bridge-game, subjects game/). The game does not publish yet; its types are named when
          # it does (needs_you.<kind> feeds bridge-push). The prefix keeps them from being flagged on day one.
          - {type: "dev.bnei.game.*", subject: "game/...", ce_id: "set by the game", ce_id_kind: fact, producer: client/bridge-game, trust: [], note: "the game owns the namespace; replace this with its concrete types once it publishes"}

          # bridge-kwatch (cmd/kwatch). A client: actor machine, neither trust fact. ids come from the object's resourceVersion or uid.
          - {type: dev.bnei.k8s.warning, subject: "k8s/<ns|_>/<kind>/<name>", ce_id: "k8s.warning/<event uid>/<count>", ce_id_kind: fact, producer: client/bridge-kwatch, trust: []}
          - {type: dev.bnei.deploy.health, subject: "argocd/<app>", ce_id: "deploy.health/<app>/<resourceVersion>", ce_id_kind: storage, producer: client/bridge-kwatch, trust: [], note: "resourceVersion is an etcd revision: it restarts after an etcd rebuild or restore"}
          - {type: dev.bnei.deploy.synced, subject: "argocd/<app>", ce_id: "deploy.synced/<app>/<resourceVersion>", ce_id_kind: storage, producer: client/bridge-kwatch, trust: [], note: "resourceVersion is an etcd revision: it restarts after an etcd rebuild or restore"}
          - {type: dev.bnei.deploy.flapping, subject: "argocd/<app>", ce_id: "deploy.flapping/<app>/<signal>/<resourceVersion>", ce_id_kind: storage, producer: client/bridge-kwatch, trust: [], note: "resourceVersion is an etcd revision: it restarts after an etcd rebuild or restore"}

          # agent-fleet core (client bridge-core, privileged). Agents name their own types under the prefix.
          - {type: "dev.bnei.agent.*", subject: "forge/... or agent/...", ce_id: "hex(sha256(session id \\x00 idempotency_key)[:16]) when the agent gives an idempotency_key, else a random uuid", ce_id_kind: transport, producer: client/bridge-core, trust: [actor_trusted], note: "a fact (a retry is the same event) only with an idempotency_key; without one a retry is stored twice. actor_trusted only when a bridge event caused the publishing session"}
          - {type: dev.bnei.fleet.session.waiting, subject: "fleet/client/<invoker>/<session id>", ce_id: "<session id>:<position>:waiting", ce_id_kind: fact, producer: client/bridge-core, trust: []}
          - {type: dev.bnei.fleet.session.resumed, subject: "fleet/client/<invoker>/<session id>", ce_id: "<session id>:<position>:resumed", ce_id_kind: fact, producer: client/bridge-core, trust: []}
          - {type: dev.bnei.fleet.card.opened, subject: "forge/<owner>/<repo> or forge/<owner>/<repo>/{pr,issue}/<n>, alert/<n>, alert/<group key>, agent/character/<name>, else fleet/session/<session id>", ce_id: "card/<decision id>/open", ce_id_kind: fact, producer: client/bridge-core, trust: [], note: "a card row in decisions (kind card), published by core from decisions.bridge_state; each state is published once, so a retry dedups. opened is published first when a card is first seen closed; parked cards (refused) stay unpublished and are counted; cards open at deploy are published once. Data: subject_kind, subject, decision_id, session_id, state, drafted_by, writer_definition, option_id on answered, expires_at, created_at, transitioned_at (stamped at publish time for stale and withdrawn); never the ask text. Known losses: a card that opens and closes between two ticks publishes only its last state; a session hard delete removes its cards with no terminal event, so a consumer closes an open card at expires_at; the loss is counted"}
          - {type: dev.bnei.fleet.card.answered, subject: "forge/<owner>/<repo> or forge/<owner>/<repo>/{pr,issue}/<n>, alert/<n>, alert/<group key>, agent/character/<name>, else fleet/session/<session id>", ce_id: "card/<decision id>/answered", ce_id_kind: fact, producer: client/bridge-core, trust: [], note: "a card row in decisions (kind card), published by core from decisions.bridge_state; each state is published once, so a retry dedups. opened is published first when a card is first seen closed; parked cards (refused) stay unpublished and are counted; cards open at deploy are published once. Data: subject_kind, subject, decision_id, session_id, state, drafted_by, writer_definition, option_id on answered, expires_at, created_at, transitioned_at (stamped at publish time for stale and withdrawn); never the ask text. Known losses: a card that opens and closes between two ticks publishes only its last state; a session hard delete removes its cards with no terminal event, so a consumer closes an open card at expires_at; the loss is counted"}
          - {type: dev.bnei.fleet.card.expired, subject: "forge/<owner>/<repo> or forge/<owner>/<repo>/{pr,issue}/<n>, alert/<n>, alert/<group key>, agent/character/<name>, else fleet/session/<session id>", ce_id: "card/<decision id>/expired", ce_id_kind: fact, producer: client/bridge-core, trust: [], note: "a card row in decisions (kind card), published by core from decisions.bridge_state; each state is published once, so a retry dedups. opened is published first when a card is first seen closed; parked cards (refused) stay unpublished and are counted; cards open at deploy are published once. Data: subject_kind, subject, decision_id, session_id, state, drafted_by, writer_definition, option_id on answered, expires_at, created_at, transitioned_at (stamped at publish time for stale and withdrawn); never the ask text. Known losses: a card that opens and closes between two ticks publishes only its last state; a session hard delete removes its cards with no terminal event, so a consumer closes an open card at expires_at; the loss is counted"}
          - {type: dev.bnei.fleet.card.stale, subject: "forge/<owner>/<repo> or forge/<owner>/<repo>/{pr,issue}/<n>, alert/<n>, alert/<group key>, agent/character/<name>, else fleet/session/<session id>", ce_id: "card/<decision id>/stale", ce_id_kind: fact, producer: client/bridge-core, trust: [], note: "a card row in decisions (kind card), published by core from decisions.bridge_state; each state is published once, so a retry dedups. opened is published first when a card is first seen closed; parked cards (refused) stay unpublished and are counted; cards open at deploy are published once. Data: subject_kind, subject, decision_id, session_id, state, drafted_by, writer_definition, option_id on answered, expires_at, created_at, transitioned_at (stamped at publish time for stale and withdrawn); never the ask text. Known losses: a card that opens and closes between two ticks publishes only its last state; a session hard delete removes its cards with no terminal event, so a consumer closes an open card at expires_at; the loss is counted"}
          - {type: dev.bnei.fleet.card.withdrawn, subject: "forge/<owner>/<repo> or forge/<owner>/<repo>/{pr,issue}/<n>, alert/<n>, alert/<group key>, agent/character/<name>, else fleet/session/<session id>", ce_id: "card/<decision id>/withdrawn", ce_id_kind: fact, producer: client/bridge-core, trust: [], note: "a card row in decisions (kind card), published by core from decisions.bridge_state; each state is published once, so a retry dedups. opened is published first when a card is first seen closed; parked cards (refused) stay unpublished and are counted; cards open at deploy are published once. Data: subject_kind, subject, decision_id, session_id, state, drafted_by, writer_definition, option_id on answered, expires_at, created_at, transitioned_at (stamped at publish time for stale and withdrawn); never the ask text. Known losses: a card that opens and closes between two ticks publishes only its last state; a session hard delete removes its cards with no terminal event, so a consumer closes an open card at expires_at; the loss is counted"}

          # atlas world events (client bridge-atlas, subjects world/). Node ids hold "/". The publish grant is the prefix "world/"; a subscription takes "world/*" (* matches "/", so
          # ids with "/" are covered); "world/" alone matches only history.rebased. No entity.changed: a move (Realm/Parent/Group change) is not an event; the library re-reads atlas for current state.
          - {type: dev.bnei.world.entity.created, subject: "world/<node id>", ce_id: "<node id>:created:<epoch>.<seq>", ce_id_kind: fact, producer: client/bridge-atlas, trust: [], note: "epoch-qualified projection id: grows across rebuilds; a retry carries the same id from the outbox"}
          - {type: dev.bnei.world.entity.retired, subject: "world/<node id>", ce_id: "<node id>:retired:<epoch>.<seq>", ce_id_kind: fact, producer: client/bridge-atlas, trust: [], note: "epoch-qualified projection id: grows across rebuilds; a retry carries the same id from the outbox"}
          - {type: dev.bnei.world.bond.added, subject: "world/<edge from id>", ce_id: "<hex(sha256(edge key)[:8])>:added:<epoch>.<seq>", ce_id_kind: fact, producer: client/bridge-atlas, trust: [], note: "edge key is atlas_edge_ver.key: From, To, Kind and Origin joined by single spaces; epoch-qualified projection id: grows across rebuilds; a retry carries the same id from the outbox"}
          - {type: dev.bnei.world.bond.removed, subject: "world/<edge from id>", ce_id: "<hex(sha256(edge key)[:8])>:removed:<epoch>.<seq>", ce_id_kind: fact, producer: client/bridge-atlas, trust: [], note: "edge key is atlas_edge_ver.key: From, To, Kind and Origin joined by single spaces; epoch-qualified projection id: grows across rebuilds; a retry carries the same id from the outbox"}
          - {type: dev.bnei.world.history.rebased, subject: "world/", ce_id: "rebased:<epoch>.<seq>", ce_id_kind: fact, producer: client/bridge-atlas, trust: [], note: "epoch-qualified projection id: grows across rebuilds; a retry carries the same id from the outbox; rebased means re-snapshot atlas at this epoch.seq, per-entity events before it are not a complete history"}

          # GitHub: retiring with the move to Forgejo. A redelivery keeps its X-GitHub-Delivery GUID, so it is deduplicated; only separate deliveries of one fact are stored twice.
          - {type: dev.bnei.github.pull_request.opened, subject: "github/<owner>/<repo>/pr/<n>", ce_id: "<X-GitHub-Delivery>", ce_id_kind: transport, status: retiring, producer: github, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.github.pull_request.synchronize, subject: "github/<owner>/<repo>/pr/<n>", ce_id: "<X-GitHub-Delivery>", ce_id_kind: transport, status: retiring, producer: github, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.github.pull_request.closed, subject: "github/<owner>/<repo>/pr/<n>", ce_id: "<X-GitHub-Delivery>", ce_id_kind: transport, status: retiring, producer: github, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.github.pull_request.reopened, subject: "github/<owner>/<repo>/pr/<n>", ce_id: "<X-GitHub-Delivery>", ce_id_kind: transport, status: retiring, producer: github, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.github.pull_request.labeled, subject: "github/<owner>/<repo>/pr/<n>", ce_id: "<X-GitHub-Delivery>", ce_id_kind: transport, status: retiring, producer: github, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.github.issues.opened, subject: "github/<owner>/<repo>/issue/<n>", ce_id: "<X-GitHub-Delivery>", ce_id_kind: transport, status: retiring, producer: github, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.github.issues.labeled, subject: "github/<owner>/<repo>/issue/<n>", ce_id: "<X-GitHub-Delivery>", ce_id_kind: transport, status: retiring, producer: github, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.github.issue_comment.created, subject: "github/<owner>/<repo>/<pr|issue>/<n>", ce_id: "<X-GitHub-Delivery>", ce_id_kind: transport, status: retiring, producer: github, trust: [actor_trusted, thread_owned]}
          - {type: dev.bnei.github.pull_request_review.submitted, subject: "github/<owner>/<repo>/pr/<n>", ce_id: "<X-GitHub-Delivery>", ce_id_kind: transport, status: retiring, producer: github, trust: [actor_trusted, thread_owned]}
