# ukubi-bridge on infra-bootstrap's common-app-chart. Read by ArgoCD through
# infra-bootstrap gitops/apps/registry.yaml (`valuesPath: [helm/values.yaml]`),
# which also sets ingress.hostname: events.bnei.dev. Modelled on mountain's.

# One writer to the events log and one LISTEN connection: never two pods, never
# a rolling overlap (ADR-0060 Decision 1).
replicaCount: 1
strategy:
  type: Recreate

image:
  repository: registry.bnei.lan:5000/ukubi-bridge
  # Bumped by ukubi-ci image.yml (called from .github/workflows/app.yml) to
  # `<short sha>@sha256:<digest>`, so a rebuild of the same commit redeploys.
  #
  # `unreleased` is a placeholder that fails loudly. The registry entry in
  # infra-bootstrap belongs after this repo's first CI run on main has replaced
  # this line, or the first sync is an ImagePullBackOff against a tag that was
  # never built (hq/wird/mountain have the same rule).
  tag: "d7fa0f3746cc@sha256:99199b22ca750c13c55ec6b2518649be6c0f49b5adebdb04c345ae786dbf441f"

service:
  port: 8080
  # /metrics on its own port (BRIDGE_METRICS_ADDR, default :9090), never on the
  # public port above: the ingress reaches only that one.
  extraPorts:
    - name: metrics
      port: 9090

# ROLLOUT ORDER: values reach ArgoCD before ukubi-ci moves the image pin, and an
# image without :9090 would be scraped into connection refused (TargetDown).
# Switched on 2026-11-23 once the pinned image (1fbab8d, #34) served /metrics on
# :9090 (checked through the API server proxy: every bridge_flow_enabled is 1).
# It gates the PrometheusRule too.
metrics:
  serviceMonitor:
    enabled: true
    port: metrics

# Prefer a node without Loki: both are single writers with a disk, and a shared node
# makes one outage of two (preferred, never required: a one-node cluster still schedules).
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          namespaces: [monitoring]
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: loki
              app.kubernetes.io/instance: platform-loki

# Public on ONE path. The chart's IngressRoute matches
# Host(events.bnei.dev) && PathPrefix(/webhook/github), so /healthz,
# /webhook/alertmanager, /webhook/grafana, /webhook/forgejo and the
# BridgeService API are reachable only in-cluster. The baseline chain (origin
# lock, rate limit, headers) stays on. /webhook/forgejo is routed too, LAN-only
# from the Forgejo host (below).
ingress:
  pathPrefix: /webhook/github
  # Forgejo (CT 305, 192.168.1.214) delivers over the LAN: CT 305 pins
  # events.bnei.dev to the Traefik VIP .233 in its /etc/hosts (infra-bootstrap
  # forgejo-configure.yml), so it never crosses Cloudflare, whose WAF skip
  # rule covers /webhook/github only. Locked to .214 (Traefik sees the real
  # peer: externalTrafficPolicy Local) and HMAC-checked like /webhook/github.
  extraRoutes:
    forgejo:
      match: Host(`{{ .Values.ingress.hostname }}`) && PathPrefix(`/webhook/forgejo`)
      priority: 100
      middlewares:
        - name: forgejo-only
          namespace: ukubi-bridge

# BRIDGE_DATABASE_URL, BRIDGE_GITHUB_WEBHOOK_SECRET, BRIDGE_GITHUB_APP_ID,
# BRIDGE_GITHUB_APP_PRIVATE_KEY, BRIDGE_ALERT_TOKEN and
# BRIDGE_FORGEJO_WEBHOOK_SECRET (optional: without it /webhook/forgejo is
# off, one WARN line at start), rendered by
# infra-bootstrap gitops/bootstrap/ukubi-bridge-secret.yaml. It still renders
# the retired BRIDGE_CLIENTS too (ignored, logged at start) until ADR-0066's
# rollout removes it. BRIDGE_OIDC_* are not secrets: they are explicit `env`
# below, which wins over this Secret. Not optional: without the webhook
# secret the bridge exits, and a CreateContainerConfigError names the cause
# faster than a crash loop. Env is bound at start: restart after a rotation.
envFrom:
  - secretRef:
      name: ukubi-bridge-config

env:
  # Logins whose PRs and comments may open threads.
  - name: BRIDGE_TRUSTED_LOGINS
    value: "MohammadBnei"
  # Fleet agent logins: tagged actor=agent, never trusted (github.Policy).
  # The ukubi-fleet App's bot (App id 5395733, infra-bootstrap ADR-0062).
  - name: BRIDGE_AGENT_LOGINS
    value: "ukubi-fleet[bot]"
  # The same two lists for Forgejo (git.bnei.dev), read by /webhook/forgejo
  # only: ukubi-fleet and ukubi-review are free names on GitHub, so they must
  # never be agents there. The Forgejo bot users are ukubi-fleet (writer) and
  # ukubi-review (reviewer).
  - name: BRIDGE_FORGEJO_TRUSTED_LOGINS
    value: "MohammadBnei"
  - name: BRIDGE_FORGEJO_AGENT_LOGINS
    value: "ukubi-fleet,ukubi-review"
  # The Forgejo relist loop: off while the repo list is empty. Its token is
  # BRIDGE_FORGEJO_READER_TOKEN from the ukubi-bridge-config Secret (the
  # restricted bridge-reader bot, read only). The token-file variable is no
  # longer set here, so an image that predates the env token stays off (one
  # WARN) instead of erroring on every run; the bridge still honours the file
  # if set, for one release.
  - name: BRIDGE_FORGEJO_RELIST_REPOS
    value: "mohammadbnei/infra-bootstrap,mohammadbnei/agent-fleet,mohammadbnei/dream-analyst,mohammadbnei/drop,mohammadbnei/editable-blog,mohammadbnei/has-journal,mohammadbnei/hq,mohammadbnei/mountain,mohammadbnei/pi-lab,mohammadbnei/ukubi-bridge,mohammadbnei/ukubi-stt,mohammadbnei/vos-monolith,mohammadbnei/wird,mohammadbnei/ukubi-game,mohammadbnei/ukubi-go,mohammadbnei/ukubi-kit,mohammadbnei/ukubi-ci,mohammadbnei/ukubi-meet"
  # API clients are authentik service accounts (infra-bootstrap ADR-0066):
  # this table holds what each may publish and read, never a secret. Explicit
  # env, so a key of the same name in the envFrom Secret cannot override it.
  # Only bridge-core may be privileged; one subscription's filter must fit one
  # of its client's rules. bridge-atlas reads every type to resolve Systems and
  # tags events with them (Tag); it publishes only its world events
  # (dev.bnei.world. on world/; the row name is frozen: it is the event
  # source, so dedup and consumers key on it). It signs in with its pod's
  # projected token ("sa"), or still with its authentik password. bridge-kwatch is the k8s
  # watch adapter (helm/kwatch.yaml): it publishes deploy and k8s events, reads
  # nothing. Its grant is the cross product of both lists (any deploy.* or
  # k8s.* type on argocd/ or k8s/), accepted: a type prefix ends with a dot, so
  # it cannot name the exact types (dev.bnei.deploy.health has no suffix to
  # match), and publish has no per-type subject rules.
  - name: BRIDGE_API_CLIENTS
    value: |
      {
        "bridge-core": {"kind": "agent", "privileged": true,
          "publish_types": ["dev.bnei.agent.", "dev.bnei.fleet.session.", "dev.bnei.fleet.card."],
          "publish_subjects": ["fleet/", "forge/", "github/", "alert/", "agent/"],
          "subscribe": [{"types": ["dev.bnei.github.", "dev.bnei.forge.", "dev.bnei.alert.", "dev.bnei.agent."], "subjects": [""]}]},
        "bridge-game": {"kind": "bot",
          "publish_types": ["dev.bnei.game."], "publish_subjects": ["game/"],
          "subscribe": [{"types": ["dev.bnei.fleet.session."], "subjects": ["fleet/client/game/"]},
                        {"types": ["dev.bnei.alert."], "subjects": [""]}]},
        "bridge-push": {"kind": "bot", "publish_types": [], "publish_subjects": [],
          "subscribe": [{"types": ["dev.bnei.game.needs_you."], "subjects": ["game/"]}]},
        "bridge-atlas": {"kind": "machine", "sa": "mountain:atlas", "publish_types": ["dev.bnei.world."], "publish_subjects": ["world/"], "tag": true,
          "subscribe": [{"types": ["dev.bnei."], "subjects": [""]}]},
        "bridge-kwatch": {"kind": "machine",
          "publish_types": ["dev.bnei.deploy.", "dev.bnei.k8s."], "publish_subjects": ["argocd/", "k8s/"]}
      }
  - name: BRIDGE_OIDC_ISSUER
    value: "https://authentik.bnei.dev/application/o/ukubi-bridge-api/"
  - name: BRIDGE_OIDC_CLIENT_ID
    value: "ukubi-bridge-api"
  # The trust anchor: authentik's signing certificate (PEM, one per key during
  # a rotation). "authentik Self-signed Certificate", shared by every provider
  # (taken from the atlas-api JWKS x5c, kid qqrvnSRh..., 2026-11-21). The
  # hourly JWKS check below logs a mismatch after a rotation.
  - name: BRIDGE_OIDC_CERT
    value: |
      -----BEGIN CERTIFICATE-----
      MIIFUjCCAzqgAwIBAgIQVLuPFjSmRGGcUwdXhSg43zANBgkqhkiG9w0BAQsFADAd
      MRswGQYDVQQDDBJhdXRoZW50aWsgMjAyNi41LjYwHhcNMjYwODE3MjIzMDI2WhcN
      MjcwODE4MjIzMDI2WjBWMSowKAYDVQQDDCFhdXRoZW50aWsgU2VsZi1zaWduZWQg
      Q2VydGlmaWNhdGUxEjAQBgNVBAoMCWF1dGhlbnRpazEUMBIGA1UECwwLU2VsZi1z
      aWduZWQwggIiMA0GCSqGSIb3DQEBAQUAA4ICDwAwggIKAoICAQC6r/TtR4qLUoHF
      Ylv1T3izn4t4n3L1d2VAF0GSpcAiikyY5lEQyaTCR/m+eFTLAIITchiWSZgM5WbF
