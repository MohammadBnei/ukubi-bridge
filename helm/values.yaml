# ukubi-bridge on infra-bootstrap's common-app-chart. Read by ArgoCD through
# infra-bootstrap gitops/apps/registry.yaml (`valuesPath: [helm/values.yaml]`),
# which also sets ingress.hostname: events.bnei.dev. Modelled on mountain's.

# One writer to the events log and one LISTEN connection: never two pods, never
# a rolling overlap (ADR-0060 Decision 1).
replicaCount: 1
strategy:
  type: Recreate

image:
  repository: registry.bnei.lan:5000/ukubi-bridge
  # Bumped by .github/workflows/app.yml to the commit's short SHA.
  #
  # `unreleased` is a placeholder that fails loudly. The registry entry in
  # infra-bootstrap belongs after this repo's first CI run on main has replaced
  # this line, or the first sync is an ImagePullBackOff against a tag that was
  # never built (hq/wird/mountain have the same rule).
  tag: "61456ec44fa7"

service:
  port: 8080

# Public on ONE path. The chart's IngressRoute matches
# Host(events.bnei.dev) && PathPrefix(/webhook/github), so /healthz and the
# future /webhook/alertmanager and gRPC API are reachable only in-cluster. The
# baseline chain (origin lock, rate limit, headers) stays on.
ingress:
  pathPrefix: /webhook/github

# BRIDGE_DATABASE_URL, BRIDGE_GITHUB_WEBHOOK_SECRET, BRIDGE_GITHUB_APP_ID,
# BRIDGE_GITHUB_APP_PRIVATE_KEY, BRIDGE_ALERT_TOKEN, rendered by infra-bootstrap
# gitops/bootstrap/ukubi-bridge-secret.yaml. Not optional: without the webhook
# secret the bridge exits, and a CreateContainerConfigError names the cause
# faster than a crash loop. Env is bound at start: restart after a rotation.
envFrom:
  - secretRef:
      name: ukubi-bridge-config

env:
  # Logins whose PRs and comments may open threads.
  - name: BRIDGE_TRUSTED_LOGINS
    value: "MohammadBnei"
  # Fleet agent logins: tagged actor=agent, never trusted (github.Policy).
  # The ukubi-fleet App's bot (App id 5395733, infra-bootstrap ADR-0062).
  - name: BRIDGE_AGENT_LOGINS
    value: "ukubi-fleet[bot]"
  # API clients are authentik service accounts (infra-bootstrap ADR-0066):
  # this table holds what each may publish and read, never a secret. Explicit
  # env, so a key of the same name in the envFrom Secret cannot override it.
  # Only bridge-core may be privileged; one subscription's filter must fit one
  # of its client's rules.
  - name: BRIDGE_API_CLIENTS
    value: |
      {
        "bridge-core": {"kind": "agent", "privileged": true,
          "publish_types": ["dev.bnei.agent.", "dev.bnei.fleet.session."],
          "publish_subjects": ["fleet/", "github/", "alert/", "agent/"],
          "subscribe": [{"types": ["dev.bnei.github.", "dev.bnei.alert.", "dev.bnei.agent."], "subjects": [""]}]},
        "bridge-game": {"kind": "bot",
          "publish_types": ["dev.bnei.game."], "publish_subjects": ["game/"],
          "subscribe": [{"types": ["dev.bnei.fleet.session."], "subjects": ["fleet/client/game/"]},
                        {"types": ["dev.bnei.alert."], "subjects": [""]}]},
        "bridge-push": {"kind": "bot", "publish_types": [], "publish_subjects": [],
          "subscribe": [{"types": ["dev.bnei.game.needs_you."], "subjects": ["game/"]}]}
      }
  - name: BRIDGE_OIDC_ISSUER
    value: "https://authentik.bnei.dev/application/o/ukubi-bridge-api/"
  - name: BRIDGE_OIDC_CLIENT_ID
    value: "ukubi-bridge-api"
  # The trust anchor: authentik's signing certificate (PEM, one per key during
  # a rotation). Empty until the provider exists (ADR-0066 rollout): the API
  # then refuses every call and the webhooks keep working.
  - name: BRIDGE_OIDC_CERT
    value: ""
  # Compared with the pinned certificate hourly; a mismatch only logs.
  - name: BRIDGE_OIDC_JWKS_URL
    value: "http://platform-authentik-server.authentik.svc.cluster.local/application/o/ukubi-bridge-api/jwks/"
  # Under limits.memory (128Mi), so the GC works harder before the kernel
  # OOM-kills the pod. A soft limit: it does not cap the allocation itself.
  - name: GOMEMLIMIT
    value: "100MiB"

livenessProbe:
  enabled: true
  path: /healthz
readinessProbe:
  enabled: true
  path: /healthz

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

# distroless static:nonroot runs as 65532. Nothing writes to disk.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
