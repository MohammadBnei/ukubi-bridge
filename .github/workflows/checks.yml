# Tests and lint on the Talos runner (k8s-ubuntu-latest). On a pull request, and
# called from app.yml (workflow_call), whose image build needs them: main re-runs
# the full gate before it builds. No image build on a PR (owner decision, CI/CD
# split): images are CD's, built from reviewed main on the build runner.
name: checks

on:
  workflow_call:
  pull_request:

# A newer push to a PR supersedes its older run; app.yml's call never cancels.
# The PR payload, not event_name, which Forgejo reports as workflow_call in a call.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event.pull_request && true || false }}

permissions:
  contents: read

jobs:
  # The Talos runner (k8s-ubuntu-latest): no service containers there, so the
  # database tests get a disposable database from the dev IntegreSQL (ADR-0088,
  # ukubi-ci's dev-db action). The tests create further databases of their own on
  # that Postgres (the integresql_test role has CREATEDB).
  test:
    runs-on: k8s-ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # the split is explicit, see Cache keys
      # Cache model (owner decision 2026-11-22): a PR restores and saves; push, tag,
      # dispatch, schedule and workflow_call from main never restore (a PR job can forge
      # the cache write key), they run cold and only save. Decided here in shell, not in an if:.
      # CACHE_EPOCH is a user-level Forgejo variable; bump it to purge every cache at once.
      - name: Cache keys
        id: cachekeys
        env:
          REF: ${{ github.ref }}
          EPOCH: ${{ vars.CACHE_EPOCH || 'e1' }}
        run: |
          set -euo pipefail
          pr=false
          if [[ "$REF" == refs/pull/* ]]; then pr=true; fi
          h=$({ cat go.mod; [ ! -f go.sum ] || cat go.sum; } | sha256sum | cut -c1-16)
          {
            echo "pr=$pr"
            echo "base=${EPOCH}-go-test-${RUNNER_OS}-${h}"
            echo "prefix=${EPOCH}-go-test-${RUNNER_OS}-"
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        if: steps.cachekeys.outputs.pr == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          # Never an exact hit (the run id is new): restore-keys picks the newest entry.
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.base }}-
            ${{ steps.cachekeys.outputs.prefix }}
      - name: Dev database
        uses: MohammadBnei/ukubi-ci/actions/dev-db@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release
        with:
          integresql-url: http://integresql.dev-services.svc.cluster.local:5000
          postgres-host: dev-postgres.dev-services.svc.cluster.local
          # An empty template: the store migrates on Open, so there is nothing to seed.
          template-hash: bridge
          timeout-seconds: '120'
      - name: go vet + go test
        run: |
          set -euo pipefail
          export BRIDGE_TEST_DATABASE_URL="$DATABASE_URL"
          go vet ./...
          # Packages whose tests use the dev database run with -count=1 (Go cannot
          # track database state); every other package may come from Go's test cache.
          # Same flags, so the compiled test binaries are shared.
          unc=(./cmd/bridge ./internal/store ./internal/bus)
          go list "${unc[@]}" > "$RUNNER_TEMP/uncached.txt"
          rest=()
          while IFS= read -r pkg; do rest+=("$pkg"); done < <(go list ./... | grep -vxFf "$RUNNER_TEMP/uncached.txt" || true)
          [ ${#rest[@]} -eq 0 ] || go test -race "${rest[@]}"
          go test -race -count=1 "${unc[@]}"
      - name: Save Go cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}

      - name: Give the dev database back
        if: always()
        uses: MohammadBnei/ukubi-ci/actions/dev-db-release@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release

  # golangci-lint v2.14.0, as agent-fleet's go.yml pins it (the version built
  # with the go1.27.4 this module declares; a linter built with an older Go
  # refuses a newer module). Default linters, no config file.
  lint:
    runs-on: k8s-ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # the split is explicit, see Cache keys
      # Cache model (owner decision 2026-11-22): a PR restores and saves; push, tag,
      # dispatch, schedule and workflow_call from main never restore (a PR job can forge
      # the cache write key), they run cold and only save. Decided here in shell, not in an if:.
      # CACHE_EPOCH is a user-level Forgejo variable; bump it to purge every cache at once.
      - name: Cache keys
        id: cachekeys
        env:
          REF: ${{ github.ref }}
          EPOCH: ${{ vars.CACHE_EPOCH || 'e1' }}
        run: |
          set -euo pipefail
          pr=false
          if [[ "$REF" == refs/pull/* ]]; then pr=true; fi
          h=$({ cat go.mod; [ ! -f go.sum ] || cat go.sum; } | sha256sum | cut -c1-16)
          {
            echo "pr=$pr"
            echo "base=${EPOCH}-go-lint-${RUNNER_OS}-${h}"
            echo "prefix=${EPOCH}-go-lint-${RUNNER_OS}-"
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        if: steps.cachekeys.outputs.pr == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          # Never an exact hit (the run id is new): restore-keys picks the newest entry.
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.base }}-
            ${{ steps.cachekeys.outputs.prefix }}
      # A go install'ed binary, not golangci-lint-action: the action restores its own
      # cache, which a push must never do. Built with the module's go1.27.4.
      - name: golangci-lint
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/golangci" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          "$RUNNER_TEMP/golangci/golangci-lint" run ./...

      - name: Save Go cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
