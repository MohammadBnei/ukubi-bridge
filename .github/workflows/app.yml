# Test and lint, then call the shared image.yml (ukubi-ci): it builds the bridge image on the build-runner
# LXC, pushes it to the in-cluster Zot registry, and pins <sha>@<digest> in helm/values.yaml so ArgoCD rolls it
# out. The bump (GITHUB_TOKEN) never triggers another run, and helm/** is not a trigger path, so it cannot loop.
# No :latest is pushed any more (nothing pulls it).
#
# This repo is PUBLIC, and every job here runs on the build runner (GitHub-hosted runners are billing-locked),
# where `sudo buildah` is root. The `if:` on the image job does NOT keep fork PRs off that runner: a pull_request
# run uses the workflow file from the PR's merge commit, which the fork author writes. What stops it is the repo
# setting "require approval for all external contributors": GET
# repos/{owner}/{repo}/actions/permissions/fork-pr-contributor-approval must return approval_policy =
# all_external_contributors. Read the workflow diff of any fork PR before approving its run. The image job runs only
# on push/dispatch, so the base workflow itself never gives a PR the registry credential.
name: app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/app.yml'

# A newer push to a PR supersedes its older run; push and dispatch runs never cancel (run_id keeps them apart).
concurrency:
  group: app-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default for a job with no permissions block of its own. Every job here
# declares one today (the image job grants what image.yml needs), so this
# only covers a job added later without one.
permissions:
  contents: read

jobs:
  # The store tests get a real Postgres through `sudo buildah` (the runner has no docker `services:`; the image
  # comes from the ECR mirror of Docker Hub, which rate-limits the LAN's one address).
  test:
    runs-on: [self-hosted, ukubi-build]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: postgres 18 (buildah)
        run: |
          port=$((20000 + GITHUB_RUN_ID % 20000))
          ctr=$(sudo buildah from public.ecr.aws/docker/library/postgres:18.7-alpine)
          echo "PG_CTR=$ctr" >> "$GITHUB_ENV"
          nohup sudo buildah run --network host --env POSTGRES_PASSWORD=t "$ctr" -- \
            docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1 -p "$port" >"$RUNNER_TEMP/pg.log" 2>&1 &
          echo "PG_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 60); do (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null && break; sleep 2; done
          (exec 3<>"/dev/tcp/127.0.0.1/$port") || { cat "$RUNNER_TEMP/pg.log"; exit 1; }
          echo "BRIDGE_TEST_DATABASE_URL=postgres://postgres:t@127.0.0.1:$port/postgres?sslmode=disable" >> "$GITHUB_ENV"
      - name: go vet + go test
        run: |
          set -euo pipefail
          go vet ./...
          go test -race ./...
      - name: stop postgres
        if: always()
        run: |
          kill "$PG_PID" 2>/dev/null || true # sudo relays the signal to buildah run, which stops the container
          sleep 3
          sudo buildah rm "$PG_CTR" || true

  # golangci-lint v2.14.0, as agent-fleet's go.yml pins it (the version built
  # with the go1.27.4 this module declares; a linter built with an older Go
  # refuses a newer module). Default linters, no config file.
  lint:
    runs-on: [self-hosted, ukubi-build]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  # Build, push and deploy live in the shared ukubi-ci workflow (digest-pinned tag, stale-run guard, deploy job).
  # Its per-image, per-ref concurrency replaces the old app-build/app-deploy groups.
  image:
    needs: [test, lint]
    # Registry creds are readable only on push/workflow_dispatch (OIDC claim),
    # and image.yml's guard decides again.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@8782d42e1d4e5cd0b8af9d1a14c9d5414976a4c9 # v0.7.0
    with:
      runs-on: '["self-hosted","ukubi-build"]'
      image: ukubi-bridge
    # image.yml's build job reads the registry password over OIDC, its deploy job pushes the bump.
    permissions:
      contents: write
      id-token: write
