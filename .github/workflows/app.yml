# Test and lint, then call the shared image.yml (ukubi-ci): it builds the bridge image on the build-runner
# LXC, pushes it to the in-cluster Zot registry, and pins <sha>@<digest> in helm/image.yaml on the `deploy` branch (ArgoCD layers it over helm/values.yaml) so ArgoCD rolls it
# out. The bump (GITHUB_TOKEN) never triggers another run, and helm/** is not a trigger path, so it cannot loop.
# No :latest is pushed any more (nothing pulls it).
#
# This repo is PUBLIC, and that `if:` on the image job does NOT keep fork PRs off
# the build runner. A pull_request run uses the workflow file from the PR's
# merge commit, which the fork author writes, so they can add their own job
# with `runs-on: [self-hosted, ukubi-build]`; on that box `sudo buildah` is
# root. What stops it is the repo setting "require approval for all external
# contributors": GET repos/{owner}/{repo}/actions/permissions/fork-pr-contributor-approval
# must return approval_policy = all_external_contributors. Read the workflow
# diff of any fork PR before approving its run. Tests run
# GitHub-hosted (wird's arrangement) and the image job only on push/dispatch so
# that the base workflow itself never gives a PR the runner or the credential (image.yml's guard also refuses a
# non-ubuntu runs-on on pull_request, but it is a tripwire only).
name: app

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/app.yml'

# A newer push to a PR supersedes its older run; push and dispatch runs never cancel (run_id keeps them apart).
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default for a job with no permissions block of its own. Every job here
# declares one today (the image job grants what image.yml needs), so this
# only covers a job added later without one.
permissions:
  contents: read

jobs:
  # Forgejo's container runner (ubuntu-latest), so the store tests get a real
  # Postgres from a service container and never touch the build runner.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_PASSWORD: t
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # On Forgejo the job runs in a container: the service is reached by its name.
      BRIDGE_TEST_DATABASE_URL: postgres://postgres:t@postgres:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go vet + go test
        run: |
          set -euo pipefail
          go vet ./...
          go test -race ./...

  # golangci-lint v2.14.0, as agent-fleet's go.yml pins it (the version built
  # with the go1.27.4 this module declares; a linter built with an older Go
  # refuses a newer module). Default linters, no config file.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  # Build, push and deploy live in the shared ukubi-ci workflow (digest-pinned tag, stale-run guard, deploy job).
  # The workflow-level group above serialises main runs (Forgejo ignores image.yml's job-level groups).
  image:
    needs: [test, lint]
    # Registry creds are readable only on push/workflow_dispatch (OIDC claim),
    # and image.yml's build job is the only one on the self-hosted runner.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      # The pin file on the deploy branch (ukubi-ci 0.11), not main's values.
      values-file: helm/image.yaml
      runs-on: '["ukubi-build"]'
      image: ukubi-bridge
    # image.yml's build job reads the registry password over OIDC, its deploy job pushes the bump.
    permissions:
      contents: write
      id-token: write
